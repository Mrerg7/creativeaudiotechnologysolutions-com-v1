# Workers Static Assets + Worker for canonical host redirects and path rewrites
name = "creativeaudiotechnologysolutions-com-v1"
main = "src/worker.ts"
compatibility_date = "2026-08-01"
workers_dev = true

[[routes]]
pattern = "creativeaudiotechnologysolutions.com"
custom_domain = true

[[routes]]
pattern = "www.creativeaudiotechnologysolutions.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Required so host redirects and path rewrites run before HTML handling
run_worker_first = true
# Disable 307 trailing-slash / .html redirects (GSC "Page with redirect")
html_handling = "none"
# Serve dist/404.html with a real 404 status for unknown paths
not_found_handling = "404-page"
